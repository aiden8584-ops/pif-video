<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#1E2B4A">
<script>
  // 삼성 인터넷은 "앱 설치" 시 구형 패키지를 만들어 Play 프로텍트 경고가 뜸 → 삼성 인터넷에는 앱 정보(manifest)를 주지 않고
  // 일반 "홈 화면 바로가기"로만 추가되게 함. 크롬 등 다른 브라우저는 정상 설치.
  if (!/SamsungBrowser/i.test(navigator.userAgent)) {
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  }
</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PIF 학습실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PIF 학습실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#1E2B4A; --navy-2:#2E3F69; --ink:#151B2C; --sub:#69707E; --faint:#9AA0AC;
    --line:#E3E6EC; --bg:#F3F4F7; --paper:#FFFFFF;
    --coral:#E8613C; --coral-bg:#FDEDE7; --hl:#FFE066; --ok:#17915A; --ok-bg:#E3F4EB; --mid-bg:#FFF3C4; --mid:#8A6700;
    --bad:#C2381B; --bad-bg:#FBE7E2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);min-height:100%;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-feature-settings:"tnum"}
  body.login-mode{background:var(--navy)}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  :focus-visible{outline:2.5px solid var(--coral);outline-offset:2px}
  .page{max-width:560px;margin:0 auto;min-height:100vh}

  /* ---------- 로그인 ---------- */
  #vLogin{display:flex;flex-direction:column;min-height:100vh}
  .brand{flex:1;padding:64px 26px 34px;color:#fff;display:flex;flex-direction:column;justify-content:center}
  .brand h1{font-weight:900;letter-spacing:-.05em;line-height:1.02}
  .brand h1 .pif{display:block;font-size:72px;color:var(--coral);letter-spacing:.01em}
  .brand h1 .room{display:block;font-size:44px;margin-top:6px}
  .lead{margin-top:26px;font-size:20px;font-weight:700;letter-spacing:-.035em;line-height:1.45;color:rgba(255,255,255,.9)}
  .catch{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
  .catch span{background:linear-gradient(transparent 58%,rgba(255,224,102,.55) 58%,rgba(255,224,102,.55) 92%,transparent 92%);padding:0 2px}
  .sheet{background:var(--paper);border-radius:26px 26px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom))}
  .role{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:20px}
  .role button{border:0;background:none;height:44px;border-radius:11px;font-size:15px;font-weight:700;color:var(--sub)}
  .role button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,27,44,.12)}
  .fld{margin-bottom:18px}
  .fld label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
  .in{width:100%;height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:17px;outline:none;background:#fff}
  .in:focus{border-color:var(--navy)}
  .pin{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pin div{height:60px;border:1.5px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;transition:border-color .12s}
  .pin div.f{border-color:var(--navy)}
  .pin.focus div.c{border-color:var(--navy);box-shadow:0 0 0 3px rgba(46,63,105,.14)}
  .pin input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;caret-color:transparent}
  .go{width:100%;height:56px;border:0;border-radius:14px;background:var(--coral);color:#fff;font-size:17px;font-weight:800}
  .go:disabled{opacity:.6}
  .err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:12px;text-align:center}
  .help{text-align:center;font-size:12.5px;color:var(--faint);margin-top:4px}
  .help a{color:inherit}

  /* ---------- 앱 공통 ---------- */
  #vApp{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;position:sticky;top:0;z-index:5;background:var(--bg)}
  .logo{font-weight:900;font-size:16px;letter-spacing:-.03em;color:var(--navy)}
  .logo b{color:var(--coral)}
  .me{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--sub);background:none;border:0}
  .me i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;display:grid;place-items:center;font-size:11.5px;font-weight:700}
  .head{padding:12px 18px 6px}
  .head h1{font-size:22px;font-weight:800;letter-spacing:-.035em}
  .head p{font-size:13px;color:var(--sub);margin-top:4px}
  .sec{padding:0 14px}
  .sec-t{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 8px}
  .sec-t h2{font-size:15.5px;font-weight:800;letter-spacing:-.03em}
  .sec-t button{background:none;border:0;font-size:13px;color:var(--navy-2);font-weight:700}
  .card{background:var(--paper);border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--line)}
  .card h3{font-size:15.5px;font-weight:800;letter-spacing:-.025em;line-height:1.4}
  .meta{font-size:12.5px;color:var(--sub)}
  .meta b{color:var(--ink)}
  .kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin-top:12px;font-size:14px;line-height:1.55}
  .kv dt{color:var(--sub);font-size:13px}
  .kv dd{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--bg);color:var(--sub);white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.mid{background:var(--mid-bg);color:var(--mid)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .badge.navy{background:var(--navy);color:#fff}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .empty{text-align:center;color:var(--sub);padding:44px 24px;font-size:14px;line-height:1.7}
  .empty.sm{padding:22px 16px;font-size:13.5px}
  .skel{height:96px;border-radius:16px;margin:0 14px 10px;background:linear-gradient(90deg,#fff 25%,#F6F7F9 50%,#fff 75%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E8EAEF;border-radius:12px;padding:3px;margin:8px 18px 4px}
  .seg button{border:0;background:none;height:38px;border-radius:10px;font-size:14px;font-weight:700;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,27,44,.1)}

  /* 홈 */
  .hello{margin:6px 14px 0;background:var(--navy);color:#fff;border-radius:20px;padding:20px 18px}
  .hello .who{font-size:13px;opacity:.7}
  .hello h1{font-size:22px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
  .hello h1 small{font-size:15px;font-weight:700;opacity:.85}
  .hello .sch{margin-top:14px;display:grid;gap:6px;font-size:13.5px}
  .hello .sch div{display:flex;gap:8px}
  .hello .sch span{opacity:.6;flex:0 0 58px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 14px 0}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;text-align:left}
  .stat .n{font-size:22px;font-weight:800;letter-spacing:-.04em}
  .stat .n small{font-size:13px;font-weight:700;color:var(--sub);margin-left:1px}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .vidcta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--coral-bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .vidcta b{font-size:15px;color:var(--coral)}
  .vidcta span{font-size:13px;color:var(--sub);display:block;margin-top:2px}
  .vidcta i{margin-left:auto;font-style:normal;color:var(--coral);font-weight:800}

  /* 공지 */
  .notice{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
  .notice summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .notice summary::-webkit-details-marker{display:none}
  .notice summary .t{flex:1;min-width:0}
  .notice summary b{display:block;font-size:14.5px;font-weight:700;line-height:1.4}
  .notice summary .pre{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notice[open] summary .pre{display:none}
  .notice .body{padding:0 16px 16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  .pinmark{font-size:11px;font-weight:800;color:#fff;background:var(--coral);border-radius:5px;padding:2px 6px;flex:0 0 auto;margin-top:2px}

  /* 성적 */
  .chart{width:100%;height:auto;display:block;margin-top:8px}
  .score{font-size:30px;font-weight:900;letter-spacing:-.04em}
  .score small{font-size:15px;color:var(--sub);font-weight:700}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px}
  .legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--navy-2);vertical-align:middle;margin-right:5px}
  .legend i.dash{border-top:2px dashed var(--coral)}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .tbl td{padding:10px 4px;border-top:1px solid var(--line)}
  .tbl td:last-child{text-align:right}

  /* 자료 */
  .search{display:block;width:calc(100% - 36px);margin:10px 18px 4px;height:46px;border-radius:12px;background:var(--paper);
    border:1px solid var(--line);padding:0 14px;font-size:15px;outline:none}
  .search:focus{border-color:var(--navy)}
  .search::placeholder{color:var(--faint)}
  .file{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;background:var(--paper);border:0;border-top:1px solid var(--line);text-align:left}
  .file:first-of-type{border-top:0}
  .file .ic{flex:0 0 40px;height:46px;border-radius:8px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;font-size:11px;font-weight:900}
  .file .ic.etc{background:var(--bg);color:var(--sub)}
  .file .t{flex:1;min-width:0}
  .file .t b{display:block;font-size:14.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
  .file .t span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
  .file .dl{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--navy-2)}
  .fgroup{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
  .fgroup h3{font-size:13px;font-weight:800;color:var(--sub);padding:12px 14px 4px}

  /* 영상 목록 (기존 영상 강의실) */
  .tabs{display:flex;gap:22px;padding:4px 18px 0;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:0;padding:11px 0;font-size:14.5px;font-weight:700;color:var(--faint)}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--navy)}
  .tabs em{font-style:normal;color:var(--coral);margin-left:3px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .vlist{padding-top:6px}
  .it{display:flex;gap:13px;align-items:center;width:100%;padding:13px 18px;background:var(--paper);border:0;border-bottom:1px solid var(--line);text-align:left}
  .it:active{background:#F7F8FA}
  .tile{flex:0 0 58px;height:58px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .tile .d{font-size:19px;font-weight:800;letter-spacing:-.03em}
  .tile .w{font-size:11px;opacity:.72;margin-top:5px}
  .tile.done{background:var(--ok-bg);color:var(--ok)}
  .tile.mid{background:var(--mid-bg);color:var(--mid)}
  .it .t{flex:1;min-width:0}
  .it .t b{display:block;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.025em;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .it .t span{display:block;font-size:12.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;border-radius:9px;background:#E8EAEF;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;border-radius:9px;background:var(--navy-2)}
  .bar i.ok{background:var(--ok)}
  .st{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--faint);white-space:nowrap}
  .st.ok{color:var(--ok)} .st.mid{color:var(--mid)}
  .new{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#fff;background:var(--coral);padding:2px 6px;border-radius:5px}

  /* 플레이어 */
  .back{background:none;border:0;padding:8px 0;font-size:14.5px;font-weight:700;color:var(--navy-2)}
  .pwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pinfo{background:var(--paper);padding:18px 18px 20px;border-bottom:1px solid var(--line)}
  .pmeta{font-size:12.5px;color:var(--sub)}
  .pinfo h2{margin:6px 0 4px;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.38}
  .prange{font-size:13.5px;color:var(--sub)}
  .pprog{display:flex;align-items:center;gap:10px;margin-top:14px}
  .pprog .bar{flex:1;margin:0}
  .memo{margin-top:14px;font-size:13.5px;line-height:1.6;background:var(--bg);border-radius:10px;padding:11px 13px;white-space:pre-wrap}
  .alert{margin:14px 18px 0;background:#FFF4E5;color:#7A4300;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55}
  .fallback{padding:16px 18px 40px;font-size:13px;color:var(--sub);text-align:center}
  .fallback a{color:var(--navy-2);font-weight:700}

  /* 하단 탭 */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
  .nav div{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .nav button{border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:11.5px;font-weight:700;color:var(--faint);position:relative}
  .nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav button.on{color:var(--navy)}
  .nav .dot{position:absolute;top:10px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;
    font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 4px}

  /* 앱 설치 안내 */
  .install{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed #C9CEDA;background:#fff;border-radius:14px;padding:12px 14px;margin-top:14px}
  .install img{width:40px;height:40px;border-radius:10px;flex:0 0 40px}
  .install b{display:block;font-size:14.5px;font-weight:800}
  .install span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45}
  .install i{margin-left:auto;font-style:normal;font-weight:800;color:#fff;background:var(--navy);border-radius:9px;padding:7px 11px;font-size:13px;white-space:nowrap}
  .install.home{margin:10px 0 0}
  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:rgba(21,27,44,.94);color:#fff;
    padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (min-width:600px){ .brand{padding-top:76px} .sheet{border-radius:26px;margin:0 16px 24px} }
</style>
</head>
<body class="login-mode">
<div class="page">

  <!-- ============ 로그인 ============ -->
  <section id="vLogin" hidden>
    <div class="brand">
      <h1><span class="pif">PIF</span><span class="room">학습실</span></h1>
      <div class="lead">진도·과제·성적·자료,<br>여기서 한 번에.</div>
      <div class="catch">결국, 영어는 <span>주찬솔</span></div>
    </div>
    <form class="sheet" id="loginForm" autocomplete="on" novalidate>
      <div class="role" id="roleSeg" role="tablist" aria-label="로그인 구분">
        <button type="button" class="on" data-r="student" role="tab" aria-selected="true">학생</button>
        <button type="button" data-r="parent" role="tab" aria-selected="false">학부모</button>
      </div>
      <div class="fld"><label for="inName" id="nameLbl">이름</label>
        <input class="in" id="inName" name="name" autocomplete="off" placeholder="홍길동"></div>
      <div class="fld"><label for="inPhone" id="phoneLbl">학생 휴대폰 뒷자리</label>
        <div class="pin" id="pin">
          <div></div><div></div><div></div><div></div>
          <input id="inPhone" name="last4" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="휴대폰 뒷자리 4개">
        </div></div>
      <button class="go" id="loginBtn" type="submit">들어가기</button>
      <div class="err" id="loginErr" role="alert"></div>
      <div class="help">로그인이 안 되면 학원 <a href="tel:025258584">02-525-8584</a></div>
      <div class="installSlot"></div>
    </form>
  </section>

  <!-- ============ 앱 ============ -->
  <section id="vApp" hidden>
    <div class="top">
      <div class="logo"><b>PIF</b> 학습실</div>
      <button class="me" id="meBtn" title="로그아웃"><span id="meWho"></span><i id="meAvatar"></i></button>
    </div>

    <!-- 홈 -->
    <div id="tHome" class="tab"></div>

    <!-- 수업 -->
    <div id="tLesson" class="tab" hidden>
      <div class="head"><h1>진도 · 과제</h1><p id="lessonSum"></p></div>
      <div class="seg" id="lessonSeg">
        <button class="on" data-k="lesson">정규 수업</button>
        <button data-k="clinic">클리닉</button>
      </div>
      <div class="sec" id="lessonList"></div>
    </div>

    <!-- 성적 -->
    <div id="tScore" class="tab" hidden>
      <div class="head"><h1>성적</h1><p>리뷰테스트와 시험 결과</p></div>
      <div class="sec" id="scoreBody"></div>
    </div>

    <!-- 자료 -->
    <div id="tFiles" class="tab" hidden>
      <div class="head"><h1>자료실</h1><p id="fileSum">수업 자료를 내려받을 수 있어요</p></div>
      <input class="search" id="fq" type="search" placeholder="파일 이름으로 찾기">
      <div class="sec" id="fileBody" style="padding-top:8px"></div>
    </div>

    <!-- 영상 (학생만) -->
    <div id="tVideo" class="tab" hidden>
      <div class="head"><h1>수업 영상</h1><p id="vstat"></p></div>
      <input class="search" id="q" type="search" placeholder="제목, 지문, 날짜로 찾기">
      <div class="tabs" id="vtabs" role="tablist">
        <button class="on" data-s="all">전체</button>
        <button data-s="todo">안 본 영상<em id="todoN"></em></button>
        <button data-s="done">완료</button>
      </div>
      <div class="chips" id="classChips" hidden></div>
      <div class="vlist" id="vlist"></div>
    </div>
  </section>

  <!-- ============ 플레이어 ============ -->
  <section id="vPlayer" hidden>
    <div class="top"><button class="back" id="backBtn">← 목록</button><div class="logo"><b>PIF</b> 학습실</div></div>
    <div class="pwrap" id="pwrap"></div>
    <div class="pinfo">
      <div class="pmeta" id="pMeta"></div>
      <h2 id="pTitle"></h2>
      <div class="prange" id="pRange"></div>
      <div class="pprog"><div class="bar"><i id="pBar"></i></div><span class="st" id="pPct"></span></div>
      <div class="memo" id="pMemo" hidden></div>
    </div>
    <div class="alert" id="pErr" hidden></div>
    <div class="fallback">영상이 안 나오면 <a id="ytLink" target="_blank" rel="noopener">유튜브에서 보기</a><br>(이 경우 시청 기록이 남지 않아요)</div>
  </section>
</div>

<nav class="nav" id="nav" hidden><div>
  <button class="on" data-t="tHome"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-t="tLesson"><svg viewBox="0 0 24 24"><path d="M9 4h6M9 4a2 2 0 0 0-2 2H5v15h14V6h-2a2 2 0 0 0-2-2M9 4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/><path d="m8.5 13 2.5 2.5 5-5"/></svg>진도·과제</button>
  <button data-t="tScore"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>성적</button>
  <button data-t="tFiles"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 12v6M9 15l3 3 3-3"/></svg>자료</button>
  <button data-t="tVideo" id="navVideo" hidden><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9.2 5 2.8-5 2.8z"/></svg>영상<em class="dot" id="navVidDot" hidden></em></button>
</div></nav>
<div id="toast" role="status"></div>

<script>
/* ======================= 설정 ======================= */
// ① 새로 배포한 "PIF 학습관리 포털" Apps Script 웹앱 주소 (끝이 /exec)
const PORTAL_API = 'https://script.google.com/macros/s/AKfycbyRwaQjLjV81zxxIAhZSfOboNfC6cdTP2dIw7EQcPvWLdnH78_Lu1v3QdjA37W1SuK2/exec';
// ② 기존 "PIF 영상 강의실" Apps Script 주소 (바꾸지 마세요)
const VIDEO_API  = 'https://script.google.com/macros/s/AKfycbyhcI255CEU2Qn-x2i1QivUGVwk179sDB19QCvmRfWvQ-yRKJyIoJ-bhKNtUGoFNwys/exec';
const BUCKET = 10;           // 영상 Code.gs의 BUCKET_SEC과 동일
let DONE = 90;

/* ======================= 공통 ======================= */
const $ = s => document.querySelector(s);
const S = {
  role:'student', token:null, p:null,               // 포털
  vtoken:null, videos:[], vErr:'', vLoaded:false,    // 영상
  cls:'전체', status:'all', q:'', cur:null,
  files:null, fq:'', lessonKind:'lesson', tab:'tHome', last:{name:'', last4:''}
};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cleanMsg(e){ return String((e && e.message) || e || '오류가 발생했습니다.').replace(/^(Error|Exception):\s*/,''); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function parseD(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function md(iso){ const d=parseD(iso); return d ? (d.getMonth()+1)+'.'+d.getDate() : (iso||''); }
function wd(iso){ const d=parseD(iso); return d ? '일월화수목금토'[d.getDay()] : ''; }
function mdw(iso){ return iso ? md(iso) + ' (' + wd(iso) + ')' : ''; }
function daysAgo(iso){ const d=parseD(iso); return d ? Math.floor((Date.now()-d.getTime())/86400000) : 999; }
function fmtTime(s){ s=Math.floor(s); const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }
function initials(name){ const n=String(name||'').trim(); return n.length >= 3 ? n.slice(1,3) : n; }
function size(b){ return b > 1048576 ? (b/1048576).toFixed(1)+'MB' : Math.max(1, Math.round(b/1024))+'KB'; }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

// 상태값 → 색
function tone(v){
  v = String(v||'');
  if (!v) return '';
  if (/^(출석|완료|통과|우수|양호|재시험 통과)/.test(v)) return 'ok';
  if (/(무단|미제출|미완료|미통과|지도필요)/.test(v)) return 'bad';
  if (/(지각|일부|미완|미지참|재시|보완|미응시|미실시|사유결석|결석)/.test(v)) return 'mid';
  return '';
}
function badge(label, v){ return v ? '<span class="badge ' + tone(v) + '">' + esc(label ? label + ' ' + v : v) + '</span>' : ''; }

/* ======================= 서버 호출 ======================= */
function post(url, action, data){
  if (!url || url.indexOf('http') !== 0) return Promise.reject(new Error('서버 주소가 설정되지 않았어요.'));
  return fetch(url, { method:'POST', body: JSON.stringify({ action, data }) })
    .then(r => r.json())
    .then(j => { if (j.error) throw new Error(j.error); return j.result; });
}
async function portal(action, data){
  try { return await post(PORTAL_API, action, Object.assign({}, data, { token:S.token })); }
  catch (e) { if (String(e.message).indexOf('SESSION_EXPIRED') >= 0) logout('오래 지나서 다시 로그인해 주세요.'); throw e; }
}
function video(action, data){ return post(VIDEO_API, action, Object.assign({}, data, { token:S.vtoken })); }

// 로그인 유지: 같은 탭에서 새로고침할 때만 유지 (탭을 닫으면 사라짐)
const SKEY = 'pif_portal_sess';
function saveSess(){
  try { sessionStorage.setItem(SKEY, JSON.stringify({ token:S.token, role:S.role, vtoken:S.vtoken, tab:S.tab, kind:S.lessonKind })); } catch(e){}
}
function loadSess(){ try { return JSON.parse(sessionStorage.getItem(SKEY)); } catch(e){ return null; } }
function clearSess(){ try { sessionStorage.removeItem(SKEY); } catch(e){} }

/* ======================= 로그인 ======================= */
function setRole(r){
  S.role = r;
  document.querySelectorAll('#roleSeg button').forEach(b => {
    const on = b.dataset.r === r; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
  });
  $('#nameLbl').textContent = r === 'parent' ? '자녀(학생) 이름' : '이름';
  $('#phoneLbl').textContent = r === 'parent' ? '학부모님 휴대폰 뒷자리' : '학생 휴대폰 뒷자리';
  $('#loginErr').textContent = '';
  try { localStorage.setItem('pif_role', r); } catch(e){}
}
$('#roleSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setRole(b.dataset.r); });

function renderPin(){
  const v = $('#inPhone').value.replace(/\D/g,'').slice(0,4);
  $('#inPhone').value = v;
  document.querySelectorAll('#pin div').forEach((d,i) => {
    d.textContent = v[i] || '';
    d.classList.toggle('f', i < v.length);
    d.classList.toggle('c', i === Math.min(v.length, 3));
  });
}
$('#inPhone').addEventListener('input', () => {
  renderPin();
  if ($('#inPhone').value.length === 4 && $('#inName').value.trim()) $('#loginForm').requestSubmit();
});
$('#inPhone').addEventListener('focus', () => $('#pin').classList.add('focus'));
$('#inPhone').addEventListener('blur', () => $('#pin').classList.remove('focus'));

let busy = false;
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const name = $('#inName').value.trim();
  const last4 = $('#inPhone').value.replace(/\D/g,'');
  $('#loginErr').textContent = '';
  if (!name) { $('#loginErr').textContent = '이름을 입력해 주세요.'; $('#inName').focus(); return; }
  if (last4.length !== 4) { $('#loginErr').textContent = '휴대폰 뒷자리 4개를 입력해 주세요.'; $('#inPhone').focus(); return; }
  busy = true;
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '확인 중…';
  try {
    const r = await post(PORTAL_API, 'login', { name, last4, role:S.role });
    S.token = r.token; S.role = r.role; S.last = { name, last4 }; S.vtoken = null;
    saveSess();
    await enterApp();
  } catch (err) {
    $('#loginErr').textContent = cleanMsg(err);
    $('#inPhone').value = ''; renderPin();
  } finally {
    busy = false; btn.disabled = false; btn.textContent = '들어가기';
  }
});

function logout(msg){
  if (S.token) post(PORTAL_API, 'logout', { token:S.token }).catch(()=>{});
  clearSess();
  stopTick(); try { if (player && player.destroy) player.destroy(); } catch(e){}
  Object.assign(S, { token:null, p:null, vtoken:null, videos:[], vErr:'', vLoaded:false, files:null, cur:null, last:{name:'',last4:''} });
  $('#inName').value = ''; $('#inPhone').value = ''; renderPin();
  $('#loginErr').textContent = msg || '';
  showView('vLogin');
}
$('#meBtn').addEventListener('click', () => { if (confirm('로그아웃할까요?')) logout(); });

/* ======================= 화면 전환 ======================= */
function showView(id){
  ['vLogin','vApp','vPlayer'].forEach(v => $('#'+v).hidden = (v !== id));
  $('#nav').hidden = id !== 'vApp';
  document.body.classList.toggle('login-mode', id === 'vLogin');
  window.scrollTo(0,0);
}
function go(tab, fromPop){
  if (tab === 'tVideo' && S.role !== 'student') tab = 'tHome';
  if (!fromPop && S.token && tab !== S.tab) { try { history.pushState({ pif:'app', tab:tab }, ''); } catch(e){} }
  S.tab = tab; if (S.token) saveSess();
  document.querySelectorAll('.tab').forEach(t => t.hidden = (t.id !== tab));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  window.scrollTo(0,0);
  if (tab === 'tFiles' && !S.files) loadFiles();
  if (tab === 'tVideo') renderVideos();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); });

async function enterApp(startTab){
  showView('vApp');
  $('#tHome').innerHTML = '<div class="skel" style="height:150px;margin-top:6px"></div><div class="skel"></div><div class="skel"></div>';
  // 뒤로 가기 처리용 기록: [base] → [app]
  try { history.replaceState({ pif:'base' }, ''); history.pushState({ pif:'app', tab:'tHome' }, ''); } catch(e){}
  S.tab = 'tHome'; go('tHome', true);
  const isStudent = S.role === 'student';
  $('#navVideo').hidden = !isStudent;
  if (isStudent) loadVideos();      // 영상은 따로, 기다리지 않음
  try {
    S.p = await portal('portal');
  } catch (e) {
    if (String(e.message).indexOf('SESSION_EXPIRED') >= 0) return;
    $('#tHome').innerHTML = '<div class="empty">정보를 불러오지 못했어요.<br>' + esc(cleanMsg(e)) + '</div>';
    return;
  }
  const p = S.p;
  $('#meWho').textContent = p.role === 'parent' ? p.name + ' 학부모님' : p.classes.join(', ');
  $('#meAvatar').textContent = initials(p.name);
  renderHome(); renderLessons(); renderScores();
  if (startTab && startTab !== 'tHome') go(startTab, true);
}

/* ======================= 홈 ======================= */
function lessonStats(p){
  const L = p.lessons, C = p.clinics.filter(c => c.attendance);
  const att = L.filter(l => l.attendance);
  const present = att.filter(l => /^(출석|지각)/.test(l.attendance)).length;
  const hw = L.filter(l => l.homework);
  const hwDone = hw.filter(l => l.homework === '완료').length;
  const wb = C.filter(c => c.workbook);
  const wbDone = wb.filter(c => c.workbook === '완료').length;
  const pct = (a,b) => b ? Math.round(a/b*100) : null;
  return { attend:pct(present, att.length), attendN:att.length, hw:pct(hwDone, hw.length), hwN:hw.length, wb:pct(wbDone, wb.length), wbN:wb.length };
}
function statBox(n, label){
  return '<div class="stat"><div class="n">' + (n == null ? '–' : n + '<small>%</small>') + '</div><div class="l">' + esc(label) + '</div></div>';
}

function renderHome(){
  const p = S.p, st = lessonStats(p);
  const sc = p.schedule || {};
  const L = p.lessons[0], C = p.clinics[0];
  const reviews = p.lessons.filter(l => l.reviewScore != null);
  let h = '<div class="hello"><div class="who">' + esc(p.school) + ' · ' + esc(p.classes.join(', ')) + '</div>' +
    '<h1>' + esc(p.name) + (p.role === 'parent' ? ' <small>학생 학부모님</small>' : ' <small>학생</small>') + '</h1>' +
    '<div class="sch">' +
      (sc.lessonDays ? '<div><span>정규 수업</span>매주 ' + esc(sc.lessonDays) + '요일</div>' : '') +
      (sc.clinicDay ? '<div><span>클리닉</span>매주 ' + esc(sc.clinicDay) + '요일 ' + esc(sc.clinicTime||'') + '</div>' : '') +
    '</div></div>';

  h += '<div class="stats">' + statBox(st.attend, '수업 출석률') + statBox(st.hw, '과제 완료율') + statBox(st.wb, '워크북 완료율') + '</div>';

  h += '<div class="sec">';
  if (p.role === 'student') h += '<button class="vidcta" id="vidCta" hidden><div><b id="vidCtaT"></b><span>놓친 수업도, 다시 볼 수업도 여기서.</span></div><i>→</i></button>';

  // 최근 수업
  h += '<div class="sec-t"><h2>최근 수업</h2>' + (p.lessons.length > 1 ? '<button data-go="tLesson" data-k="lesson">전체 보기</button>' : '') + '</div>';
  h += L ? lessonCard(L) : '<div class="card empty sm">아직 수업 기록이 없어요.</div>';

  // 최근 클리닉
  h += '<div class="sec-t"><h2>최근 클리닉</h2>' + (p.clinics.length > 1 ? '<button data-go="tLesson" data-k="clinic">전체 보기</button>' : '') + '</div>';
  h += C ? clinicCard(C) : '<div class="card empty sm">아직 클리닉 기록이 없어요.</div>';

  // 리뷰 점수
  if (reviews.length) {
    const r = reviews[0];
    h += '<div class="sec-t"><h2>최근 리뷰테스트</h2><button data-go="tScore">성적 보기</button></div>' +
      '<div class="card"><div class="row"><div><div class="meta">' + mdw(r.date) + (r.reviewRange ? ' · ' + esc(r.reviewRange) : '') + '</div>' +
      '<div class="score" style="margin-top:4px">' + r.reviewScore + '<small>점</small></div></div>' +
      '<div style="text-align:right">' + passBadge(r) + (r.passLine != null ? '<div class="meta" style="margin-top:6px">통과 ' + r.passLine + '점</div>' : '') + '</div></div></div>';
  }

  // 공지
  h += '<div class="sec-t"><h2>공지사항</h2></div>';
  h += p.notices.length ? p.notices.slice(0, 5).map((n, i) => noticeItem(n, i === 0 && n.pinned)).join('') +
      (p.notices.length > 5 ? '<button class="card" id="moreNotice" style="width:100%;text-align:center;font-weight:700;color:var(--navy-2);font-size:14px">공지 ' + (p.notices.length - 5) + '개 더 보기</button>' : '')
    : '<div class="card empty sm">새 공지가 없어요.</div>';
  h += '<div class="installSlot" data-home="1"></div>';
  h += '<div class="empty sm" style="padding-bottom:10px">문의 <a href="tel:' + esc(String(p.contact).replace(/\D/g,'')) + '" style="color:inherit">' + esc(p.contact) + '</a></div>';
  h += '</div>';
  $('#tHome').innerHTML = h;
  renderInstall();
  updateVidCta();
}
$('#tHome').addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { if (g.dataset.k) setLessonKind(g.dataset.k); go(g.dataset.go); return; }
  if (e.target.closest('#vidCta')) { go('tVideo'); return; }
  const m = e.target.closest('#moreNotice');
  if (m) { m.outerHTML = S.p.notices.slice(5).map(n => noticeItem(n)).join(''); }
});

function noticeItem(n, open){
  const first = String(n.body||'').split('\n').find(x => x.trim()) || '';
  return '<details class="notice"' + (open ? ' open' : '') + '><summary>' + (n.pinned ? '<span class="pinmark">중요</span>' : '') +
    '<div class="t"><b>' + esc(n.title || '공지') + '</b><div class="pre">' + esc(first) + '</div>' +
    '<div class="meta" style="margin-top:4px">' + esc(mdw(n.date)) + ' · ' + esc(n.source) + '</div></div></summary>' +
    '<div class="body">' + esc(n.body) + '</div></details>';
}

/* ======================= 진도·과제 ======================= */
function passBadge(l){
  if (l.reviewScore == null) return '';
  const ok = l.passed ? /통과|O|TRUE|합격/i.test(l.passed) && !/미통과/.test(l.passed) : (l.passLine != null ? l.reviewScore >= l.passLine : null);
  if (ok === null) return '';
  return '<span class="badge ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '통과' : '미통과') + '</span>';
}

function lessonCard(l){
  const absent = /결석/.test(l.attendance);
  let h = '<div class="card"><div class="row"><div class="meta"><b>' + mdw(l.date) + '</b> · ' + esc(l.cls) + ' 정규 수업</div>' + badge('', l.attendance) + '</div>';
  h += '<h3 style="margin-top:8px">' + esc(l.content || '수업 내용 미입력') + '</h3>';
  h += '<dl class="kv">';
  if (l.assigned) h += '<dt>이번 과제</dt><dd>' + esc(l.assigned) + '</dd>';
  if (l.homework) h += '<dt>지난 과제</dt><dd>' + esc(l.homeworkText || l.homework) + '</dd>';
  if (l.reviewScore != null || l.reviewRange) h += '<dt>리뷰테스트</dt><dd>' + (l.reviewScore != null ? '<b>' + l.reviewScore + '점</b> ' + passBadge(l) : '') +
      (l.reviewRange ? '<div class="meta">' + esc(l.reviewRange) + '</div>' : '') + '</dd>';
  if (l.retest) h += '<dt>재시험</dt><dd>' + esc(l.retestText || l.retest) + '</dd>';
  if (l.attitude && !absent) h += '<dt>수업 태도</dt><dd>' + esc(l.attitudeText || l.attitude) + (l.attitudeNote ? '<div class="meta">' + esc(l.attitudeNote) + '</div>' : '') + '</dd>';
  h += '</dl></div>';
  return h;
}

function clinicCard(c){
  let h = '<div class="card"><div class="row"><div class="meta"><b>' + mdw(c.date) + '</b> · 클리닉' + (c.time ? ' ' + esc(c.time) : '') +
    (c.kind && c.kind !== '정규' ? ' · ' + esc(c.kind) : '') + '</div>' +
    (c.attendance ? badge('', c.attendance) : '<span class="badge">' + (c.live ? '진행 중' : '기록 전') + '</span>') + '</div>';
  h += '<div class="badges">' + badge('워크북', c.workbook) + badge('실전문제', c.practice) + badge('재시험', c.retest) +
    (c.makeupVideo ? '<span class="badge navy">영상보강</span>' : '') + '</div>';
  const kv = [];
  if (c.todo) kv.push('<dt>해야 할 일</dt><dd>' + esc(c.todo) + '</dd>');
  if (c.reason) kv.push('<dt>특이사항</dt><dd>' + esc(c.reason) + '</dd>');
  if (c.leftAt) kv.push('<dt>하원</dt><dd>' + esc(c.leftAt) + '</dd>');
  if (kv.length) h += '<dl class="kv">' + kv.join('') + '</dl>';

        '<td><b>' + l.reviewScore + '점</b> ' + passBadge(l) + (l.retest ? '<div class="meta">재시험 ' + esc(l.retest) + '</div>' : '') + '</td></tr>').join('') +
      '</table></div>';
  } else h += '<div class="card empty sm">아직 리뷰테스트 기록이 없어요.</div>';

  h += '<div class="sec-t"><h2>시험 성적</h2><span class="meta">' + p.exams.length + '건</span></div>';

    (x.grade ? '<span class="badge navy">' + esc(x.grade) + (/등급/.test(x.grade) || isNaN(+x.grade) ? '' : '등급') + '</span>' : '') + '</div></div>' +
    (x.avg != null ? '<div class="meta" style="margin-top:8px">반 평균 ' + x.avg + '점 · 평균 대비 <b>' + (x.score - x.avg >= 0 ? '+' : '') + Math.round((x.score - x.avg) * 10) / 10 + '</b></div>' : '') +
    (x.note ? '<div class="memo">' + esc(x.note) + '</div>' : '') + '</div>').join('')
    : '<div class="card empty sm">아직 등록된 시험 성적이 없어요.</div>';

function chart(rows){
  const W = 320, H = 150, L = 28, R = 10, T = 12, B = 24;
  const vals = rows.map(r => r.reviewScore).concat(rows.map(r => r.passLine).filter(v => v != null));
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  lo = Math.max(0, Math.floor((lo - 5) / 10) * 10); hi = Math.min(Math.max(100, hi), Math.ceil((hi + 2) / 10) * 10 || 100);
  if (hi - lo < 20) lo = Math.max(0, hi - 20);
  const x = i => L + (rows.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (rows.length - 1));
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="리뷰테스트 점수 추이">';
  [lo, (lo + hi) / 2, hi].forEach(v => {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E3E6EC"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="#9AA0AC">' + Math.round(v) + '</text>';
  });
  const pl = rows.map((r, i) => r.passLine != null ? x(i) + ',' + y(r.passLine) : null).filter(Boolean);
  if (pl.length > 1) s += '<polyline points="' + pl.join(' ') + '" fill="none" stroke="#E8613C" stroke-width="1.6" stroke-dasharray="4 4"/>';
  s += '<polyline points="' + rows.map((r, i) => x(i) + ',' + y(r.reviewScore)).join(' ') + '" fill="none" stroke="#2E3F69" stroke-width="2.4" stroke-linejoin="round"/>';
  rows.forEach((r, i) => {
    const bad = passBadge(r).indexOf('badge bad') >= 0;
    s += '<circle cx="' + x(i) + '" cy="' + y(r.reviewScore) + '" r="4" fill="' + (bad ? '#E8613C' : '#2E3F69') + '" stroke="#fff" stroke-width="1.5"/>';
    if (rows.length <= 8 || i === 0 || i === rows.length - 1 || i % Math.ceil(rows.length / 6) === 0)
      s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (rows.length > 1 && i === 0 ? 'start' : rows.length > 1 && i === rows.length - 1 ? 'end' : 'middle') + '" font-size="10" fill="#9AA0AC">' + md(r.date) + '</text>';
  });
  return s + '</svg>';
}

/* ---------- 플레이어 + 시청 기록 ---------- */
let ytReady = null;
function loadYT(){
  if (ytReady) return ytReady;
  return ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
}
let player = null, tick = null, pending = new Set(), lastSent = 0, duration = 0;

function openVideo(id){
  const v = S.videos.find(x => x.id === id); if (!v) return;
  S.cur = v; pending = new Set(); duration = 0; lastSent = Date.now();
  try { history.pushState({ pif:'player' }, ''); } catch(e){}
  showView('vPlayer');
  $('#pMeta').textContent = md(v.date) + ' (' + wd(v.date) + ') ' + v.classes.join(', ');
  $('#pTitle').textContent = v.title;
  $('#pRange').textContent = v.range;
  $('#pMemo').hidden = !v.memo; $('#pMemo').textContent = v.memo;
  $('#pErr').hidden = true;
  updatePlayerProg();

  const start = (v.pos > 10 && v.pct < DONE) ? Math.max(0, v.pos - 3) : 0;
  $('#ytLink').href = 'https://www.youtube.com/watch?v=' + id + (start ? '&t=' + Math.floor(start) + 's' : '');
  const wrap = $('#pwrap'); wrap.innerHTML = '';
  const ifr = document.createElement('iframe');
  ifr.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen');
  ifr.setAttribute('allowfullscreen', '');
  ifr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  ifr.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
    '?enablejsapi=1&rel=0&playsinline=1&modestbranding=1' + (start ? '&start=' + Math.floor(start) : '') +
    '&origin=' + encodeURIComponent(location.origin);
  wrap.appendChild(ifr);
  if (start) toast(fmtTime(start) + '부터 이어서 재생해요');

  loadYT().then(() => {
    if (S.cur !== v) return;
    player = new YT.Player(ifr, { events: {
      onReady: () => { try { duration = player.getDuration() || 0; } catch(e){} },
      onStateChange: onState,
      onError: e => {
        $('#pErr').hidden = false;
        $('#pErr').textContent = '이 영상은 여기서 재생되지 않아요 (오류 ' + e.data + '). 아래 "유튜브에서 보기"로 열어 주세요.';
      }
    }});
  });
}
function onState(e){
  if (e.data === YT.PlayerState.PLAYING) startTick();
  else { stopTick(); if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) flush(); }
}
function startTick(){
  if (tick) return;
  tick = setInterval(() => {
    try {
      const t = player.getCurrentTime();
      duration = player.getDuration() || duration;
      pending.add(Math.floor(t / BUCKET));
      if (Date.now() - lastSent > 30000) flush();
    } catch(e){}
  }, 1000);
}
function stopTick(){ clearInterval(tick); tick = null; }
function curTime(){ try { return player ? player.getCurrentTime() : 0; } catch(e){ return 0; } }
function flush(final){
  if (!S.cur || !pending.size || !duration || !S.vtoken) return;
  const v = S.cur;
  const payload = { videoId: v.id, buckets: Array.from(pending), duration: Math.round(duration), position: Math.floor(curTime()) };
  pending = new Set(); lastSent = Date.now();
  if (final && navigator.sendBeacon) {
    navigator.sendBeacon(VIDEO_API, JSON.stringify({ action:'progress', data: Object.assign({ token:S.vtoken }, payload) }));
    return;
  }
  video('progress', payload)
    .then(r => { v.pct = r.pct; v.pos = r.pos; if (S.cur === v) updatePlayerProg(); })
    .catch(err => {
      if (String(err.message).indexOf('SESSION_EXPIRED') >= 0) { toast('영상 로그인이 만료됐어요. 다시 로그인해 주세요.'); return; }
      payload.buckets.forEach(b => pending.add(b));
    });
}
function updatePlayerProg(){
  const v = S.cur; if (!v) return;
  const ok = v.pct >= DONE;
  $('#pBar').style.width = v.pct + '%';
  $('#pBar').className = ok ? 'ok' : '';
  $('#pPct').className = 'st' + (ok ? ' ok' : (v.pct > 0 ? ' mid' : ''));
  $('#pPct').textContent = ok ? '완료' : (v.pct > 0 ? v.pct + '% 봤어요' : '아직 안 봤어요');
}
function closePlayer(){
  if (!S.cur) return;
  stopTick(); flush();
  try { if (player && player.destroy) player.destroy(); } catch(e){}
  player = null; $('#pwrap').innerHTML = '';
  S.cur = null;
  showView('vApp'); go('tVideo', true); updateVidCta();
}
// 화면의 "← 목록" 버튼도 휴대폰 뒤로 가기와 같은 길로
$('#backBtn').addEventListener('click', () => { if (history.state && history.state.pif === 'player') history.back(); else closePlayer(); });

/* ---------- 휴대폰 뒤로 가기 ---------- */
let lastBackAt = 0;
window.addEventListener('popstate', e => {
  if (!S.token) return;                                   // 로그아웃 상태면 브라우저 기본 동작
  const st = e.state || {};
  if (S.cur && st.pif !== 'player') { closePlayer(); return; }   // 영상 → 목록
  if (st.pif === 'app') { go(st.tab || 'tHome', true); return; } // 이전 탭으로
  if (st.pif === 'base' || !st.pif) {                     // 앱의 맨 처음까지 왔을 때
    if (S.tab !== 'tHome') { try { history.pushState({ pif:'app', tab:'tHome' }, ''); } catch(err){} go('tHome', true); return; }
    if (Date.now() - lastBackAt < 2000) { history.back(); return; }   // 2초 안에 한 번 더 → 나가기
    lastBackAt = Date.now();
    try { history.pushState({ pif:'app', tab:'tHome' }, ''); } catch(err){}
    toast('뒤로 가기를 한 번 더 누르면 나가요');
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });
window.addEventListener('pagehide', () => flush(true));

/* ======================= 앱 설치 ======================= */
let installEvt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const inAppBrowser = () => /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
function installHTML(home){
  if (isStandalone()) return '';
  let title = 'PIF 학습실 앱으로 설치', sub = '', btn = '';
  if (installEvt) { sub = '홈 화면에 아이콘이 생기고 앱처럼 열려요'; btn = '<i>설치</i>'; }
  else if (inAppBrowser()) { sub = isIOS() ? '메뉴에서 "Safari로 열기" 후 설치할 수 있어요' : '메뉴에서 "다른 브라우저로 열기" 후 설치할 수 있어요'; }
  else if (isIOS()) { sub = '아래 공유 버튼 □↑ → "홈 화면에 추가"'; }
  else if (/SamsungBrowser/i.test(navigator.userAgent)) { title = '크롬으로 열면 앱으로 설치돼요'; sub = '크롬이 없으면 아래 ≡ 메뉴 → "현재 페이지 추가" → "홈 화면"'; btn = '<i>크롬으로 열기</i>'; }
  else { sub = '브라우저 메뉴 ⋮ → "앱 설치" 또는 "홈 화면에 추가"'; }
  return '<button type="button" class="install' + (home ? ' home' : '') + '" data-install><img src="icon-192.png" alt=""><div><b>' + title + '</b><span>' + sub + '</span></div>' + btn + '</button>';
}
function renderInstall(){
  document.querySelectorAll('.installSlot').forEach(el => el.innerHTML = installHTML(el.dataset.home === '1'));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; renderInstall(); toast('설치됐어요! 홈 화면의 PIF 아이콘으로 열어 보세요.'); });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-install]'); if (!b) return;
  e.preventDefault();
  if (!installEvt && /SamsungBrowser/i.test(navigator.userAgent)) {
    // 삼성 인터넷 → 크롬으로 같은 주소 열기 (크롬이 없으면 플레이스토어 크롬 페이지로 이동)
    location.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch(err){} installEvt = null; renderInstall(); }
  else toast(isIOS() ? '공유 버튼 □↑ → "홈 화면에 추가"를 눌러 주세요'
    : /SamsungBrowser/i.test(navigator.userAgent) ? '아래 ≡ 메뉴 → "현재 페이지 추가" → "홈 화면"을 눌러 주세요'
    : '오른쪽 위 ⋮ 메뉴 → "앱 설치" 또는 "홈 화면에 추가"');
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ======================= 시작 ======================= */
(function init(){
  try { localStorage.removeItem('pif_session'); localStorage.removeItem('pif_cred'); } catch(e){}
  let r = null; try { r = localStorage.getItem('pif_role'); } catch(e){}
  setRole(r === 'parent' ? 'parent' : 'student');
  renderPin();
  renderInstall();
  const saved = loadSess();
  if (saved && saved.token) {
    S.token = saved.token; S.role = saved.role === 'parent' ? 'parent' : 'student'; S.vtoken = saved.vtoken || null;
    if (saved.kind === 'clinic') setLessonKind('clinic');
    enterApp(saved.tab);
    return;
  }
  showView('vLogin');
})();
</script>
</body>
